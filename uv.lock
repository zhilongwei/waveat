version = "0.1.0"
source = { editable = "." }
dependencies = [
    { name = "numpy" },
    { name = "scipy" },
]

[package.dev-dependencies]
dev = [
    { name = "basedpyright" },
    { name = "pytest" },
    { name = "pytest-cov" },
    { name = "ruff" },
]

[package.metadata]
requires-dist = [
    { name = "numpy", specifier = ">=2.5.2" },
    { name = "scipy", specifier = ">=1.18.0" },
]

[package.metadata.requires-dev]
dev = [
    { name = "basedpyright", specifier = ">=1.39.9" },
    { name = "pytest", specifier = ">=9.1.1" },
    { name = "pytest-cov", specifier = ">=7.1.0" },
    { name = "ruff", specifier = ">=0.16.2" },
]
